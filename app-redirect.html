<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>이동 중... | WooaQR</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Noto Sans KR', sans-serif; background:#10B981; color:#fff; display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; text-align:center; padding:24px; box-sizing:border-box; }
  .box { max-width:360px; }
  .spinner { width:40px; height:40px; border:4px solid rgba(255,255,255,0.3); border-top-color:#fff; border-radius:50%; margin:0 auto 20px; animation:spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 { font-size:1.1rem; margin:0 0 8px; }
  p { font-size:0.9rem; opacity:0.85; margin:0 0 20px; }
  a.manual { color:#fff; font-weight:600; text-decoration:underline; }
</style>
</head>
<body>
<div class="box">
  <div class="spinner"></div>
  <h1>앱스토어로 이동 중입니다...</h1>
  <p id="msg">잠시만 기다려주세요.</p>
  <a class="manual" id="manualLink" href="#" style="display:none;">자동으로 이동하지 않나요? 여기를 눌러주세요</a>
</div>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var ios = params.get('ios') || '';
  var android = params.get('android') || '';
  var fallback = params.get('fallback') || ios || android || '';

  var ua = navigator.userAgent || '';
  var isIOS = /iPhone|iPad|iPod/i.test(ua);
  var isAndroid = /Android/i.test(ua);

  var target = fallback;
  if (isIOS && ios) target = ios;
  else if (isAndroid && android) target = android;

  var manualLink = document.getElementById('manualLink');
  if (target) {
    manualLink.href = target;
    manualLink.style.display = 'inline-block';
    location.replace(target);
  } else {
    document.getElementById('msg').textContent = '연결할 앱 링크가 없습니다. QR코드를 다시 확인해주세요.';
  }
})();
</script>
</body>
</html>
